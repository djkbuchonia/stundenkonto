<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stundenkonto</title>
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-32.png">
<style>
  :root{
    --ink:#111111;
    --paper:#FAFAF8;
    --surface:#FFFFFF;
    --red:#C4192C;
    --red-dim:#F4DADD;
    --gray:#6E6E6C;
    --line:#E6E4E0;
    --ok:#2E7D46;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  .mono{font-family:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;}
  header{
    padding:22px 20px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:2px solid var(--ink);
    background:var(--surface);
  }
  header svg{width:34px;height:34px;flex-shrink:0;}
  header h1{
    font-size:19px;
    letter-spacing:0.02em;
    margin:0;
    font-weight:800;
  }
  header .sub{
    font-size:11px;
    color:var(--gray);
    margin-top:2px;
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .tabs{
    display:flex;
    gap:0;
    margin:18px 16px 0;
    border:2px solid var(--ink);
    border-radius:10px;
    overflow:hidden;
  }
  .tab{
    flex:1;
    padding:14px 8px;
    text-align:center;
    background:var(--surface);
    cursor:pointer;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.01em;
    border:none;
    color:var(--ink);
    transition:background .15s, color .15s;
  }
  .tab + .tab{ border-left:2px solid var(--ink); }
  .tab.active{ background:var(--ink); color:var(--paper); }
  .tab .tab-sub{ display:block; font-size:10px; font-weight:500; opacity:.65; margin-top:2px; text-transform:uppercase; letter-spacing:.06em;}

  main{ padding:18px 16px 0; max-width:520px; margin:0 auto; }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
  }
  .card h2{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.09em;
    color:var(--gray);
    margin:0 0 14px;
    font-weight:700;
  }

  /* Dial / Fortschritt */
  .dial-row{ display:flex; align-items:center; gap:20px; }
  .dial{ position:relative; width:120px; height:120px; flex-shrink:0; }
  .dial svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .dial-center{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .dial-center .num{ font-size:22px; font-weight:800; font-family:'IBM Plex Mono',monospace; }
  .dial-center .lbl{ font-size:9px; color:var(--gray); text-transform:uppercase; letter-spacing:.06em; margin-top:1px;}
  .dial-facts{ flex:1; }
  .dial-facts .row{ display:flex; justify-content:space-between; padding:5px 0; font-size:13.5px; border-bottom:1px solid var(--line); }
  .dial-facts .row:last-child{ border-bottom:none; }
  .dial-facts .row .v{ font-family:'IBM Plex Mono',monospace; font-weight:700; }
  .warn{ color:var(--red); }
  .okc{ color:var(--ok); }

  .period-nav{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:12px;
  }
  .period-nav button{
    background:none; border:1px solid var(--line); border-radius:8px;
    width:32px; height:32px; font-size:16px; cursor:pointer; color:var(--ink);
  }
  .period-label{ font-size:13px; font-weight:700; text-align:center; }
  .period-label small{ display:block; font-weight:500; color:var(--gray); font-size:10.5px; margin-top:1px;}

  .seg{ display:flex; border:1.5px solid var(--ink); border-radius:8px; overflow:hidden; margin-bottom:2px; }
  .seg button{ flex:1; padding:10px; background:var(--surface); border:none; font-size:13px; font-weight:700; cursor:pointer; color:var(--ink); }
  .seg button + button{ border-left:1.5px solid var(--ink); }
  .seg button.active{ background:var(--ink); color:var(--paper); }

  .vac-summary{ display:flex; gap:22px; }
  .vac-num{ font-family:'IBM Plex Mono',monospace; font-weight:800; font-size:28px; line-height:1; }
  .vac-num.big{ color:var(--red); }
  .vac-sub{ font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--gray); margin-top:5px; }
  .vac-settings{ display:flex; gap:8px; align-items:flex-end; margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
  .vac-settings > div{ flex:1; }
  .vac-settings .btn{ padding:11px 14px; font-size:13px; white-space:nowrap; }

  form.entry{ display:flex; flex-direction:column; gap:10px; }
  .entry .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--gray); font-weight:700; display:block; margin-bottom:4px; }
  input[type=date], input[type=number], input[type=text]{
    width:100%; padding:11px 10px; border:1.5px solid var(--line); border-radius:8px;
    font-size:15px; font-family:'IBM Plex Mono',monospace; background:var(--paper); color:var(--ink);
  }
  input[type=text]{ font-family:'Inter',sans-serif; }
  input:focus{ outline:none; border-color:var(--ink); }
  input[type=time]{
    width:100%; padding:11px 10px; border:1.5px solid var(--line); border-radius:8px;
    font-size:15px; font-family:'IBM Plex Mono',monospace; background:var(--paper); color:var(--ink);
  }
  input[type=time]:focus{ outline:none; border-color:var(--ink); }
  .calc-preview{
    background:var(--paper); border:1.5px dashed var(--line); border-radius:8px;
    padding:9px 12px; font-size:13px; color:var(--gray); text-align:center;
  }
  .calc-preview span{ font-family:'IBM Plex Mono',monospace; font-weight:800; color:var(--ink); font-size:15px; }
  .calc-preview.invalid span{ color:var(--red); }
  .btn{
    background:var(--ink); color:var(--paper); border:none; border-radius:9px;
    padding:13px; font-size:14px; font-weight:700; cursor:pointer; letter-spacing:.02em;
  }
  .btn:active{ transform:scale(0.99); }
  .btn.secondary{ background:none; color:var(--ink); border:1.5px solid var(--ink); }
  .btn.danger{ background:none; color:var(--red); border:1.5px solid var(--red); padding:7px 10px; font-size:12px; }
  .btn.edit{ background:none; color:var(--ink); border:1.5px solid var(--line); padding:7px 10px; font-size:12px; }
  .entry-actions{ display:flex; gap:6px; flex-shrink:0; }
  .form-actions{ display:flex; gap:10px; }
  .form-actions .btn{ flex:1; }
  .editing-badge{
    display:inline-block; font-size:10px; font-weight:700; padding:4px 9px; border-radius:20px;
    background:var(--ink); color:var(--paper); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px;
  }

  ul.entries{ list-style:none; margin:0; padding:0; }
  ul.entries li{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 0; border-bottom:1px solid var(--line); gap:10px;
  }
  ul.entries li:last-child{ border-bottom:none; }
  .entry-date{ font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:700; width:78px; flex-shrink:0;}
  .entry-note{ font-size:12px; color:var(--gray); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .entry-hours{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px; flex-shrink:0; }
  .empty{ color:var(--gray); font-size:13px; text-align:center; padding:20px 0; }

  .accordion-item{ border-bottom:1px solid var(--line); }
  .accordion-item:last-child{ border-bottom:none; }
  .accordion-head{
    width:100%; background:none; border:none; cursor:pointer;
    display:flex; align-items:center; gap:10px; padding:12px 0; text-align:left;
  }
  .accordion-chevron{
    font-size:16px; font-weight:700; color:var(--gray); flex-shrink:0;
    transition:transform .15s; display:inline-block;
  }
  .accordion-chevron.open{ transform:rotate(90deg); color:var(--ink); }
  .accordion-title{ font-size:13.5px; font-weight:700; flex:1; }
  .accordion-meta{ font-size:11.5px; color:var(--gray); font-family:'IBM Plex Mono',monospace; flex-shrink:0; }
  .accordion-body{ list-style:none; margin:0; padding:0; max-height:0; overflow:hidden; }
  .accordion-body.open{ max-height:none; padding-bottom:6px; }
  .accordion-body li{ padding-left:2px; padding-right:2px; }

  .badge{
    display:inline-block; font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px;
    text-transform:uppercase; letter-spacing:.05em; margin-left:6px;
  }
  .badge.warn{ background:var(--red-dim); color:var(--red); }

  .status{ font-size:11px; text-align:center; color:var(--gray); padding:10px 0 0; }
  .status.err{ color:var(--red); }

  .print-btn{ width:100%; margin-top:16px; }

  /* ====== Druckbericht ====== */
  #printReport{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #printReport, #printReport *{ visibility:visible; }
    #printReport{
      display:block; position:absolute; top:0; left:0; width:100%;
      padding:20px; font-family:'Inter',sans-serif; color:#111;
    }
    .no-print{ display:none !important; }
  }
  .pr-header{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #111; padding-bottom:10px; margin-bottom:16px; }
  .pr-header h1{ font-size:20px; margin:0 0 4px; }
  .pr-header .pr-sub{ font-size:12px; color:#555; }
  .pr-header .pr-period{ text-align:right; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:700; }
  .pr-summary{ display:flex; gap:24px; margin:14px 0 18px; padding:12px 0; border-top:1px solid #ccc; border-bottom:1px solid #ccc; }
  .pr-summary div{ font-size:12px; }
  .pr-summary .v{ font-family:'IBM Plex Mono',monospace; font-weight:800; font-size:16px; display:block; }
  .pr-table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:20px; }
  .pr-table th, .pr-table td{ border-bottom:1px solid #ddd; padding:6px 4px; text-align:left; }
  .pr-table th{ font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:#555; }
  .pr-table td.num, .pr-table th.num{ text-align:right; font-family:'IBM Plex Mono',monospace; }
  .pr-table tfoot td{ font-weight:800; border-top:2px solid #111; border-bottom:none; }
  .pr-section-title{ font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; margin:18px 0 8px; }
  .pr-footer{ font-size:10.5px; color:#777; margin-top:24px; }
  footer{ text-align:center; padding:24px 16px 8px; font-size:10.5px; color:var(--gray); }
</style>
</head>
<body>

<header>
  <svg viewBox="0 0 512 512"><circle cx="256" cy="256" r="248" fill="#111111"/><circle cx="256" cy="256" r="216" fill="#FAFAF8"/><g stroke="#111111" stroke-width="10" stroke-linecap="round"><line x1="256" y1="64" x2="256" y2="98"/><line x1="256" y1="414" x2="256" y2="448"/><line x1="64" y1="256" x2="98" y2="256"/><line x1="414" y1="256" x2="448" y2="256"/></g><line x1="256" y1="256" x2="256" y2="146" stroke="#111111" stroke-width="20" stroke-linecap="round"/><line x1="256" y1="256" x2="360" y2="256" stroke="#C4192C" stroke-width="18" stroke-linecap="round"/><circle cx="256" cy="256" r="22" fill="#111111"/><circle cx="256" cy="256" r="8" fill="#C4192C"/></svg>
  <div>
    <h1>Stundenkonto</h1>
    <div class="sub">Zeiterfassung · zwei Jobs</div>
  </div>
</header>

<div class="tabs">
  <button class="tab active" id="tab-minijob" onclick="switchJob('minijob')">
    Fashion Boots
    <span class="tab-sub">Minijob</span>
  </button>
  <button class="tab" id="tab-teilzeit" onclick="switchJob('teilzeit')">
    DSH
    <span class="tab-sub">Teilzeit</span>
  </button>
</div>

<main>

  <div class="card">
    <div class="period-nav">
      <button onclick="shiftPeriod(-1)">‹</button>
      <div class="period-label" id="periodLabel"></div>
      <button onclick="shiftPeriod(1)">›</button>
    </div>

    <div class="dial-row">
      <div class="dial">
        <svg viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" fill="none" stroke="#E6E4E0" stroke-width="10"/>
          <circle cx="60" cy="60" r="52" fill="none" stroke="#C4192C" stroke-width="10"
                  stroke-linecap="round" id="dialProgress"
                  stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
        </svg>
        <div class="dial-center">
          <div class="num" id="dialHours">0,0</div>
          <div class="lbl" id="dialUnit">Std.</div>
        </div>
      </div>
      <div class="dial-facts" id="dialFacts"></div>
    </div>
    <button type="button" class="btn secondary print-btn" onclick="printReport()">🖨️ Bericht für diesen Zeitraum drucken</button>
  </div>

  <div class="card">
    <h2>Urlaub <span id="vacYear"></span></h2>
    <div class="vac-summary">
      <div>
        <div class="vac-num big" id="vacRemaining">–</div>
        <div class="vac-sub">Resturlaub</div>
      </div>
      <div>
        <div class="vac-num" id="vacTaken">–</div>
        <div class="vac-sub">Genommen</div>
      </div>
      <div>
        <div class="vac-num" id="vacTotal">–</div>
        <div class="vac-sub">Jahresanspruch</div>
      </div>
    </div>
    <div class="vac-settings">
      <div>
        <label>Jahresurlaub (Tage)</label>
        <input type="number" id="fVacTotal" step="0.5" min="0" placeholder="z. B. 20">
      </div>
      <button type="button" class="btn secondary" onclick="saveVacationTotal()">Speichern</button>
    </div>
  </div>

  <div class="card">
    <h2 id="formHeading">Eintrag hinzufügen</h2>
    <div class="editing-badge" id="editingBadge" style="display:none;">Eintrag wird bearbeitet</div>
    <form class="entry" id="entryForm">
      <div class="seg" id="typeSeg">
        <button type="button" class="active" data-type="arbeit" onclick="setEntryType('arbeit')">Arbeitszeit</button>
        <button type="button" data-type="urlaub" onclick="setEntryType('urlaub')">Urlaub</button>
      </div>

      <div id="workFields">
        <div>
          <label>Datum</label>
          <input type="date" id="fDate">
        </div>
        <div class="grid2">
          <div>
            <label>Anfangszeit</label>
            <input type="time" id="fStart">
          </div>
          <div>
            <label>Endzeit</label>
            <input type="time" id="fEnd">
          </div>
        </div>
        <div>
          <label>Pause (Minuten)</label>
          <input type="number" id="fBreak" step="5" min="0" max="480" placeholder="z. B. 30" value="0">
        </div>
        <div class="calc-preview" id="calcPreview">Ergebnis: <span id="calcResult">0,0</span> Std.</div>
      </div>

      <div id="vacFields" style="display:none;">
        <div class="grid2">
          <div>
            <label>Von</label>
            <input type="date" id="fVacStart">
          </div>
          <div>
            <label>Bis</label>
            <input type="date" id="fVacEnd">
          </div>
        </div>
        <div>
          <label>Urlaubstage</label>
          <input type="number" id="fVacDaysInput" step="0.5" min="0.5" placeholder="z. B. 1">
        </div>
        <div class="calc-preview" id="vacCalcPreview">Werktage im Zeitraum: <span id="vacCalcResult">0</span></div>
      </div>

      <div>
        <label>Notiz (optional)</label>
        <input type="text" id="fNote" placeholder="z. B. Spätschicht">
      </div>
      <div class="form-actions">
        <button type="submit" class="btn" id="submitBtn">Eintrag speichern</button>
        <button type="button" class="btn secondary" id="cancelEditBtn" style="display:none;" onclick="cancelEdit()">Abbrechen</button>
      </div>
    </form>
    <div class="status" id="statusMsg"></div>
  </div>

  <div class="card">
    <h2>Einträge im Zeitraum</h2>
    <div class="entries" id="entriesList"></div>
  </div>

  <div class="card">
    <h2>Urlaub im Jahr</h2>
    <div class="entries" id="vacationList"></div>
  </div>

</main>

<footer>Fashion Boots &amp; DSH · lokal synchronisiert über Firebase</footer>

<div id="printReport"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, setDoc,
  onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ====== FIREBASE-KONFIGURATION ======
// Bitte mit deinen eigenen Firebase-Projektdaten ersetzen (siehe Anleitung im Chat).
const firebaseConfig = {
  apiKey: "AIzaSyBGggQn4dG9iWlP_ro8fiEMl7bc99Sv_BU",
  authDomain: "zeiterfassung-6e737.firebaseapp.com",
  projectId: "zeiterfassung-6e737",
  storageBucket: "zeiterfassung-6e737.firebasestorage.app",
  messagingSenderId: "191480337564",
  appId: "1:191480337564:web:5e0b503341d481a2514959"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ====== JOB-KONFIGURATION ======
const JOBS = {
  minijob: {
    label: "Fashion Boots",
    company: "Boots & Fashion GROUP GmbH",
    type: "minijob",
    wage: 13.90,
    monthlyHourCap: 43,
    monthlyEuroCap: 603,
    unit: "Std."
  },
  teilzeit: {
    label: "DSH",
    company: "Dr. Schmitt Handelsgesellschaft GmbH & Co. KG",
    type: "teilzeit",
    wage: 14,
    weeklyHourTarget: 16,
    unit: "Std."
  }
};

let currentJob = "minijob";
let periodOffset = 0; // 0 = aktueller Zeitraum, -1 = vorheriger, ...
let unsubscribe = null;
let allEntries = []; // aktuell geladene Einträge für den aktiven Job
let entryType = 'arbeit';
let editingEntryId = null;
let editingVacationId = null;
const currentYear = new Date().getFullYear();
let vacSettingsUnsub = null;
let vacEntriesUnsub = null;
let vacationDaysTotal = 0;
let vacationEntries = [];
let expandedWorkPeriods = new Set([periodKey(getBillingPeriod(0).start)]);
let expandedVacationPeriods = new Set([periodKey(getBillingPeriod(0).start)]);

window.switchJob = function(job){
  currentJob = job;
  periodOffset = 0;
  document.getElementById('tab-minijob').classList.toggle('active', job==='minijob');
  document.getElementById('tab-teilzeit').classList.toggle('active', job==='teilzeit');
  if(editingEntryId || editingVacationId) cancelEdit();
  const key = periodKey(getBillingPeriod(0).start);
  expandedWorkPeriods = new Set([key]);
  expandedVacationPeriods = new Set([key]);
  listenToJob();
  listenToVacation();
};

window.shiftPeriod = function(delta){
  periodOffset += delta;
  const key = periodKey(getBillingPeriod(periodOffset).start);
  expandedWorkPeriods.add(key);
  expandedVacationPeriods.add(key);
  render();
};

// ---- Abrechnungszeitraum-Logik ----
// Beide Jobs: 16. eines Monats bis 15. des Folgemonats (Fashion Boots UND DSH).
function getBillingPeriod(offset){
  const today = new Date();
  let year = today.getFullYear();
  let month = today.getMonth(); // 0-indexiert
  // Wenn wir vor dem 16. sind, gehört "heute" noch zum Zeitraum, der im Vormonat begann
  if(today.getDate() < 16){ month -= 1; }
  month += offset;
  const start = new Date(year, month, 16);
  const end = new Date(year, month+1, 15);
  return {start, end};
}
function getCurrentWeekRange(){
  const today = new Date();
  const day = (today.getDay()+6)%7; // Montag=0
  const start = new Date(today); start.setDate(today.getDate()-day);
  const end = new Date(start); end.setDate(start.getDate()+6);
  return {start, end};
}

function pad2(n){ return String(n).padStart(2,'0'); }
function toISO(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

// Ermittelt den Abrechnungszeitraum (16.–15.), zu dem ein Datum gehört.
function getPeriodForDate(dateStr){
  const d = new Date(dateStr+'T12:00:00');
  let year = d.getFullYear();
  let month = d.getMonth();
  if(d.getDate() < 16){ month -= 1; }
  const start = new Date(year, month, 16);
  const end = new Date(year, month+1, 15);
  return {start, end};
}
// Eindeutiger Schlüssel für einen Zeitraum, z. B. "2026-07-16".
function periodKey(start){
  return `${start.getFullYear()}-${pad2(start.getMonth()+1)}-16`;
}
// Wie viele Werktage eines Urlaubseintrags in einen bestimmten Zeitraum fallen (für Überschneidungen an der Zeitraumgrenze).
function vacationWeekdaysInPeriod(entry, periodStart, periodEnd){
  const entryStart = new Date(entry.startDate+'T12:00:00');
  const entryEnd = new Date((entry.endDate||entry.startDate)+'T12:00:00');
  const s = entryStart > periodStart ? entryStart : periodStart;
  const e = entryEnd < periodEnd ? entryEnd : periodEnd;
  if(s > e) return 0;
  return countWeekdays(toISO(s), toISO(e));
}

function fmtDate(d){
  return d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function fmtEuro(n){
  return n.toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
}
function fmtHours(n){
  return n.toLocaleString('de-DE', {minimumFractionDigits:1, maximumFractionDigits:2});
}
function dateInRange(dateStr, start, end){
  const d = new Date(dateStr+'T12:00:00');
  return d >= start && d <= end;
}

// Berechnet Arbeitsstunden aus Anfangszeit, Endzeit (HH:MM) und Pause in Minuten.
// Geht über Mitternacht, falls Endzeit vor Anfangszeit liegt (z. B. Nachtschicht).
function calcHours(startStr, endStr, breakMinutes){
  if(!startStr || !endStr) return null;
  const [sh, sm] = startStr.split(':').map(Number);
  const [eh, em] = endStr.split(':').map(Number);
  let startMin = sh*60 + sm;
  let endMin = eh*60 + em;
  if(endMin <= startMin) endMin += 24*60; // über Mitternacht
  const workedMin = (endMin - startMin) - Number(breakMinutes||0);
  if(workedMin < 0) return null;
  return workedMin / 60;
}

function updateCalcPreview(){
  const start = document.getElementById('fStart').value;

  const hours = calcHours(start, end, brk);
  if(hours === null){
    result.textContent = start && end ? 'ungültig' : '0,0';
    preview.classList.toggle('invalid', !!(start && end));
  } else {
    result.textContent = fmtHours(hours);
    preview.classList.remove('invalid');
  }
}

// Zählt Werktage (Mo–Fr) inklusive Start- und Enddatum.
function countWeekdays(startStr, endStr){
  if(!startStr) return 0;
  const end = endStr || startStr;
  const s = new Date(startStr+'T12:00:00');
  const e = new Date(end+'T12:00:00');
  if(e < s) return 0;
  let count = 0;
  const cur = new Date(s);
  while(cur <= e){
    const day = cur.getDay();
    if(day !== 0 && day !== 6) count++;
    cur.setDate(cur.getDate()+1);
  }
  return count;
}
function fmtDays(n){
  return n.toLocaleString('de-DE', {minimumFractionDigits:0, maximumFractionDigits:1});
}

  const daysInput = document.getElementById('fVacDaysInput');

}

function renderVacation(){
  const yearEntries = vacationEntries.filter(e => e.startDate && e.startDate.slice(0,4)===String(currentYear));
  const taken = yearEntries.reduce((s,e)=> s + Number(e.days||0), 0);
  const remaining = vacationDaysTotal - taken;

  document.getElementById('vacRemaining').textContent = fmtDays(remaining);
  document.getElementById('vacTaken').textContent = fmtDays(taken);
  document.getElementById('vacTotal').textContent = fmtDays(vacationDaysTotal);

  renderVacationAccordion(yearEntries);
}

function renderVacationAccordion(yearEntries){
  const groups = new Map();
  yearEntries.forEach(e => {
    const p = getPeriodForDate(e.startDate);
    const key = periodKey(p.start);
    if(!groups.has(key)) groups.set(key, {start:p.start, end:p.end, items:[]});
    groups.get(key).items.push(e);
  });
  const curPeriod = getBillingPeriod(periodOffset);
  const curKey = periodKey(curPeriod.start);
  if(String(curPeriod.start.getFullYear())===String(currentYear) && !groups.has(curKey)){
    groups.set(curKey, {start:curPeriod.start, end:curPeriod.end, items:[]});
  }

  const sortedKeys = [...groups.keys()].sort().reverse();
  const list = document.getElementById('vacationList');
  if(sortedKeys.length===0){
    list.innerHTML = '<div class="empty">Noch kein Urlaub eingetragen.</div>';
    return;
  }
  list.innerHTML = sortedKeys.map(key => {
    const g = groups.get(key);
    const isOpen = expandedVacationPeriods.has(key);
    const days = g.items.reduce((s,e)=> s + Number(e.days||0), 0);
    const body = g.items.length === 0
      ? '<li class="empty">Kein Urlaub in diesem Zeitraum.</li>'
      : g.items.map(e => `
        <li>
          <span class="entry-date">${fmtDate(new Date(e.startDate+'T12:00:00'))}${e.endDate && e.endDate!==e.startDate ? ' – '+fmtDate(new Date(e.endDate+'T12:00:00')) : ''}</span>
          <span class="entry-note">${e.note||''}</span>
          <span class="entry-hours">${fmtDays(Number(e.days))} Tage</span>
          <span class="entry-actions">
            <button class="btn edit" onclick="startEditVacation('${e.id}')">Bearbeiten</button>
            <button class="btn danger" onclick="removeVacation('${e.id}')">Löschen</button>
          </span>
        </li>
      `).join('');
    return `
      <div class="accordion-item">
        <button type="button" class="accordion-head" onclick="toggleVacationPeriod('${key}')">
          <span class="accordion-chevron ${isOpen?'open':''}">›</span>
          <span class="accordion-title">${fmtDate(g.start)} – ${fmtDate(g.end)}</span>
          <span class="accordion-meta">${g.items.length ? fmtDays(days)+' Tage' : 'keine Einträge'}</span>
        </button>
        <ul class="entries accordion-body ${isOpen?'open':''}">${body}</ul>
      </div>
    `;
  }).join('');
}

function render(){
  const job = JOBS[currentJob];
  const period = getBillingPeriod(periodOffset);

  document.getElementById('periodLabel').innerHTML =
    `${fmtDate(period.start)} – ${fmtDate(period.end)}<small>Abrechnungszeitraum (16.–15.)</small>`;

  const inPeriod = allEntries.filter(e => dateInRange(e.date, period.start, period.end));
  const workHours = inPeriod.reduce((s,e)=> s + Number(e.hours||0), 0);

  const vacHoursPerDay = job.type==='minijob' ? 5 : 8;
  const vacDaysInPeriod = vacationEntries.reduce((s,e)=> s + vacationWeekdaysInPeriod(e, period.start, period.end), 0);
  const vacHours = vacDaysInPeriod * vacHoursPerDay;

  const sumHours = workHours + vacHours;
  const sumEuro = sumHours * job.wage;

  // Dial
  const dial = document.getElementById('dialProgress');
  const circumference = 326.7;
  let pct = 0;
  if(job.type==='minijob'){
    pct = Math.min(sumHours / job.monthlyHourCap, 1);
  } else {
    const week = getCurrentWeekRange();
    const weekEntries = allEntries.filter(e => dateInRange(e.date, week.start, week.end));
    const weekHours = weekEntries.reduce((s,e)=> s + Number(e.hours||0), 0);
    pct = Math.min(weekHours / job.weeklyHourTarget, 1);
  }
  dial.setAttribute('stroke-dashoffset', String(circumference * (1-pct)));
  document.getElementById('dialHours').textContent = fmtHours(sumHours);
  document.getElementById('dialUnit').textContent = 'Std. im Zeitraum';

  const factsEl = document.getElementById('dialFacts');
  const vacRow = vacDaysInPeriod > 0
    ? `<div class="row"><span>davon Urlaub</span><span class="v">${fmtHours(vacHours)} Std. (${fmtDays(vacDaysInPeriod)} Tage)</span></div>`
    : '';
  if(job.type==='minijob'){
    const hoursWarn = sumHours > job.monthlyHourCap;
    const euroWarn = sumEuro > job.monthlyEuroCap;
    factsEl.innerHTML = `
      <div class="row"><span>Stunden</span><span class="v ${hoursWarn?'warn':''}">${fmtHours(sumHours)} / ${job.monthlyHourCap}</span></div>
      ${vacRow}
      <div class="row"><span>Verdienst</span><span class="v ${euroWarn?'warn':''}">${fmtEuro(sumEuro)} / ${fmtEuro(job.monthlyEuroCap)}</span></div>
      <div class="row"><span>Stundenlohn</span><span class="v">${fmtEuro(job.wage)}</span></div>
      ${(hoursWarn||euroWarn) ? '<div class="row"><span class="badge warn">Grenze überschritten</span></div>' : ''}
    `;
  } else {
    const week = getCurrentWeekRange();
    const weekEntries = allEntries.filter(e => dateInRange(e.date, week.start, week.end));
    const weekHours = weekEntries.reduce((s,e)=> s + Number(e.hours||0), 0);
    factsEl.innerHTML = `
      <div class="row"><span>Stunden (Zeitraum)</span><span class="v">${fmtHours(sumHours)}</span></div>
      ${vacRow}
      <div class="row"><span>Verdienst (Zeitraum)</span><span class="v">${fmtEuro(sumEuro)}</span></div>
      <div class="row"><span>Diese Woche</span><span class="v">${fmtHours(weekHours)} / ${job.weeklyHourTarget}</span></div>
      <div class="row"><span>Stundenlohn</span><span class="v">${fmtEuro(job.wage)}</span></div>
    `;
  }

  // Liste — gruppiert nach Zeitraum, auf-/zuklappbar
  renderWorkAccordion(period);
}

function renderWorkAccordion(currentPeriod){
  const groups = new Map(); // key -> {start, end, items}
  allEntries.forEach(e => {
    const p = getPeriodForDate(e.date);
    const key = periodKey(p.start);
    if(!groups.has(key)) groups.set(key, {start:p.start, end:p.end, items:[]});
    groups.get(key).items.push(e);
  });
  // aktuell gewählten Zeitraum immer anzeigen, auch wenn leer
  const curKey = periodKey(currentPeriod.start);
  if(!groups.has(curKey)) groups.set(curKey, {start:currentPeriod.start, end:currentPeriod.end, items:[]});

  const sortedKeys = [...groups.keys()].sort().reverse();
  const list = document.getElementById('entriesList');
  list.innerHTML = sortedKeys.map(key => {
    const g = groups.get(key);
    const isOpen = expandedWorkPeriods.has(key);
    const hours = g.items.reduce((s,e)=> s + Number(e.hours||0), 0);
    const body = g.items.length === 0
      ? '<li class="empty">Keine Einträge in diesem Zeitraum.</li>'
      : g.items.map(e => `
        <li>
          <span class="entry-date">${fmtDate(new Date(e.date+'T12:00:00'))}</span>
          <span class="entry-note">${e.start && e.end ? `${e.start}–${e.end} Uhr${e.breakMinutes ? ', ' + e.breakMinutes + ' Min. Pause' : ''}${e.note ? ' · ' + e.note : ''}` : (e.note || '')}</span>
          <span class="entry-hours">${fmtHours(Number(e.hours))} Std.</span>
          <span class="entry-actions">
            <button class="btn edit" onclick="startEditEntry('${e.id}')">Bearbeiten</button>
            <button class="btn danger" onclick="removeEntry('${e.id}')">Löschen</button>
          </span>
        </li>
      `).join('');
    return `
      <div class="accordion-item">
        <button type="button" class="accordion-head" onclick="toggleWorkPeriod('${key}')">
          <span class="accordion-chevron ${isOpen?'open':''}">›</span>
          <span class="accordion-title">${fmtDate(g.start)} – ${fmtDate(g.end)}</span>
          <span class="accordion-meta">${g.items.length} Einträge · ${fmtHours(hours)} Std.</span>
        </button>
        <ul class="entries accordion-body ${isOpen?'open':''}">${body}</ul>
      </div>
    `;
  }).join('');
}

document.getElementById('entryForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const statusMsg = document.getElementById('statusMsg');

  if(entryType === 'urlaub'){
    const start = document.getElementById('fVacStart').value;
    const end = document.getElementById('fVacEnd').value || start;
    const days = parseFloat(document.getElementById('fVacDaysInput').value);
    const note = document.getElementById('fNote').value.trim();
    if(!start || isNaN(days) || days<=0){
      statusMsg.textContent = 'Bitte Zeitraum und Urlaubstage angeben.';
      statusMsg.classList.add('err');
      return;
    }
    try{
      if(editingVacationId){
        await updateDoc(doc(db, 'vacation_'+currentJob, editingVacationId), {
          startDate: start, endDate: end, days, note
        });
        cancelEdit();
      } else {
        await addDoc(collection(db, 'vacation_'+currentJob), {
          startDate: start, endDate: end, days, note, createdAt: serverTimestamp()
        });
        document.getElementById('fNote').value = '';
        document.getElementById('fVacDaysInput').dataset.manual = '';
        document.getElementById('fVacStart').valueAsDate = new Date();
        document.getElementById('fVacEnd').valueAsDate = new Date();
        updateVacPreview();
      }
      statusMsg.classList.remove('err');
      statusMsg.textContent = 'Gespeichert.';
      setTimeout(()=> statusMsg.textContent='', 2000);
    } catch(err){
      statusMsg.classList.add('err');
      statusMsg.textContent = 'Fehler beim Speichern — Firebase-Konfiguration prüfen.';
    }
    return;
  }

  const date = document.getElementById('fDate').value;
  const start = document.getElementById('fStart').value;
  const end = document.getElementById('fEnd').value;
  const breakMinutes = parseInt(document.getElementById('fBreak').value || '0', 10);
  const note = document.getElementById('fNote').value.trim();
  const hours = calcHours(start, end, breakMinutes);
  if(!date || hours === null || hours<=0){
    statusMsg.textContent = 'Bitte gültige Zeiten angeben (Endzeit nach Anfangszeit plus Pause).';
    statusMsg.classList.add('err');
    return;
  }
  try{
    if(editingEntryId){
      await updateDoc(doc(db, 'entries_'+currentJob, editingEntryId), {
        date, start, end, breakMinutes, hours, note
      });
      cancelEdit();
    } else {
      await addDoc(collection(db, 'entries_'+currentJob), {
        date, start, end, breakMinutes, hours, note, createdAt: serverTimestamp()
      });
      document.getElementById('fNote').value = '';
      document.getElementById('fBreak').value = 0;
      document.getElementById('fStart').value = '';
      document.getElementById('fEnd').value = '';
      document.getElementById('fDate').valueAsDate = new Date();
      updateCalcPreview();
    }
    statusMsg.classList.remove('err');
    statusMsg.textContent = 'Gespeichert.';
    setTimeout(()=> statusMsg.textContent='', 2000);
  } catch(err){
    statusMsg.classList.add('err');
    statusMsg.textContent = 'Fehler beim Speichern — Firebase-Konfiguration prüfen.';
  }
});
